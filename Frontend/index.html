<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // Apply the saved (or system-preferred) theme before first paint so the
    // page never flashes the light theme.
    (function () {
      try {
        var t = localStorage.getItem("apna-ghar-theme");
        if (
          t === "dark" ||
          (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Apna Ghar — Har Sapne Ka Apna Ghar</title>
  <meta name="description" content="अपना घर, अपनी पहचान। Apna Ghar is made in India for Indian families — verified homes, direct owner contact, and honest pricing." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Yatra+One&family=Mukta:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
