    <path d="M304 490 C 304 470, 374 470, 374 490 L374 552 L304 552 Z" fill="#FFEFC9"/>
    <path d="M304 490 C 304 470, 374 470, 374 490" stroke="#945A34" stroke-width="5" fill="none"/>
    <line x1="304" y1="510" x2="374" y2="510" stroke="#945A34" stroke-width="4"/>
    <line x1="304" y1="532" x2="374" y2="532" stroke="#945A34" stroke-width="4"/>
    <line x1="321.7" y1="474" x2="321.7" y2="552" stroke="#945A34" stroke-width="3.2"/>
    <line x1="339.3" y1="474" x2="339.3" y2="552" stroke="#945A34" stroke-width="3.2"/>
