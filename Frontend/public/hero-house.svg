  <path d="M362 522 Q 400 540 438 522" stroke="#A76B41" stroke-width="3.5" fill="none"/>
  <use href="#leaf" transform="translate(372,526)"/>
  <use href="#leaf" transform="translate(388,531)"/>
  <use href="#leaf" transform="translate(404,534)"/>
  <use href="#leaf" transform="translate(420,531)"/>
  <use href="#leaf" transform="translate(436,526)"/>
  <!-- door frame sill -->
  <rect x="362" y="614" width="76" height="8" rx="4" fill="#6E4020"/>

  <!-- plinth / verandah step -->
  <rect x="272" y="618" width="256" height="16" rx="8" fill="#A76B41"/>
  <rect x="272" y="630" width="256" height="4" fill="#7F4E2B" opacity="0.5"/>

  <!-- diyas row along the plinth -->
  <use href="#diya" transform="translate(308,650)"/>
  <use href="#diya" transform="translate(348,650)"/>
  <use href="#diya" transform="translate(452,650)"/>
  <use href="#diya" transform="translate(492,650)"/>

  <!-- ground -->
  <rect x="0" y="660" width="800" height="140" fill="#DCC99F" opacity="0"/>
  <!-- path -->
  <path d="M372 634 L428 634 L470 800 L330 800 Z" fill="#E9D7AE"/>
  <path d="M372 634 L428 634 L470 800 L330 800 Z" fill="none" stroke="#D8C291" stroke-width="3"/>

  <!-- rangoli at the doorstep -->
  <g transform="translate(400,684)">
    <circle r="34" fill="#FBF2E2"/>
    <circle r="34" fill="none" stroke="#A76B41" stroke-width="2.4"/>
    <circle r="27" fill="none" stroke="#BC8744" stroke-width="1.8" stroke-dasharray="3 3"/>
    <g>
      <use href="#petal" transform="rotate(0)"/>
      <use href="#petal" transform="rotate(45)"/>
      <use href="#petal" transform="rotate(90)"/>
      <use href="#petal" transform="rotate(135)"/>
      <use href="#petal" transform="rotate(180)"/>
      <use href="#petal" transform="rotate(225)"/>
      <use href="#petal" transform="rotate(270)"/>
      <use href="#petal" transform="rotate(315)"/>
    </g>
    <circle r="8" fill="#CA9A4E"/>
    <circle r="3.4" fill="#A76B41"/>
  </g>

  <!-- matka + plant (right) -->
  <path d="M560 676 C 560 666 568 662 578 662 C 588 662 596 666 596 676 L 592 706 L 564 706 Z" fill="#A76B41"/>
  <path d="M560 676 L 596 676" stroke="#C9A07C" stroke-width="2.4"/>
  <path d="M578 662 C 566 640 574 624 586 610 C 596 628 594 646 584 660 Z" fill="#7F8F68"/>
  <path d="M578 662 C 570 648 572 634 580 622" stroke="#66744F" stroke-width="2" fill="none"/>

  <!-- marigold bush (left) -->
  <circle cx="200" cy="668" r="36" fill="#7F8F68"/>
  <circle cx="200" cy="668" r="20" fill="#66744F"/>
  <circle cx="192" cy="652" r="6" fill="#C08E42"/>
  <circle cx="207" cy="646" r="6" fill="#CA9A4E"/>
  <circle cx="202" cy="662" r="5.4" fill="#BC8744"/>
  <circle cx="212" cy="658" r="5.4" fill="#C08E42"/>

  <!-- tufted grass dots -->
  <circle cx="252" cy="668" r="2.4" fill="#66744F"/>
  <circle cx="262" cy="676" r="2.4" fill="#66744F"/>
  <circle cx="545" cy="742" r="2.4" fill="#66744F"/>
  <circle cx="556" cy="748" r="2.4" fill="#66744F"/>
  <circle cx="120" cy="750" r="2.4" fill="#66744F"/>
  <circle cx="130" cy="744" r="2.4" fill="#66744F"/>
</svg>
