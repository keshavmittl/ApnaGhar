  <!-- door -->
  <rect x="368" y="520" width="64" height="98" rx="10" fill="#945A34"/>
  <path d="M368 532 C 368 514, 432 514, 432 532 L432 618 L368 618 Z" fill="#A76B41"/>
  <rect x="374" y="526" width="52" height="88" rx="6" fill="#24180E"/>
