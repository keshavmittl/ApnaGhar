    <path d="M426 490 C 426 470, 496 470, 496 490 L496 552 L426 552 Z" fill="#FFEFC9"/>
    <path d="M426 490 C 426 470, 496 470, 496 490" stroke="#945A34" stroke-width="5" fill="none"/>
    <line x1="426" y1="510" x2="496" y2="510" stroke="#945A34" stroke-width="4"/>
    <line x1="426" y1="532" x2="496" y2="532" stroke="#945A34" stroke-width="4"/>
    <line x1="443.7" y1="474" x2="443.7" y2="552" stroke="#945A34" stroke-width="3.2"/>
    <line x1="461.3" y1="474" x2="461.3" y2="552" stroke="#945A34" stroke-width="3.2"/>
    <line x1="479" y1="474" x2="479" y2="552" stroke="#945A34" stroke-width="3.2"/>
    <circle cx="461" cy="521" r="5.4" fill="#C08E42" opacity="0.8"/>
