<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF6E7"/>
      <stop offset="0.55" stop-color="#F9E7C6"/>
      <stop offset="1" stop-color="#F3D9AE"/>
    </linearGradient>
    <linearGradient id="wallShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3E4C8"/>
      <stop offset="1" stop-color="#FFF6E4"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#CD9F52" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#CD9F52" stop-opacity="0"/>
    </radialGradient>
    <!-- toran leaf / pendant -->
    <g id="leaf">
      <path d="M0 -2 C 4.5 2 4.5 8 0 12 C -4.5 8 -4.5 2 0 -2 Z" fill="#BC8744"/>
      <path d="M0 -2 C 2 2.2 2 7 0 11.4" stroke="#8A6230" stroke-width="0.7" fill="none"/>
    </g>
    <!-- clay diya with flame -->
    <g id="diya">
      <circle cx="0" cy="-9" r="12" fill="url(#lampGlow)"/>
      <path d="M0 -15 C -4 -7 -5 -2 -5 1.5 A 8 4.6 0 0 0 5 1.5 C 5 -2 4 -7 0 -15 Z" fill="#C08E42"/>
      <path d="M0 -11.5 C -2 -7 -2.6 -3.5 -2.6 -1.2" stroke="#FDF6E7" stroke-width="1.3" stroke-linecap="round" fill="none"/>
      <path d="M-12 2 A 12 9.5 0 0 0 12 2 Z" fill="#A76B41"/>
      <path d="M-10.4 2.6 L 10.4 2.6" stroke="#D8B28C" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- rangoli petal -->
    <g id="petal">
      <path d="M0 -6 C 6 -10 6 -17 0 -22 C -6 -17 -6 -10 0 -6 Z" fill="#BC8744"/>
    </g>
  </defs>

  <!-- sky -->
  <rect width="800" height="800" fill="url(#sky)"/>
  <!-- sun with soft rays -->
  <g opacity="0.16">
    <path d="M668 62 L668 238 M578 150 L758 150" stroke="#A97130" stroke-width="4" stroke-linecap="round"/>
    <path d="M606 88 L730 212 M730 88 L606 212" stroke="#A97130" stroke-width="3" stroke-linecap="round"/>
  </g>
  <circle cx="668" cy="150" r="88" fill="#C08E42" opacity="0.2"/>
  <circle cx="668" cy="150" r="54" fill="#CA9A4E"/>
  <circle cx="668" cy="150" r="54" fill="none" stroke="#A97130" stroke-width="2" opacity="0.55" stroke-dasharray="1 7" stroke-linecap="round"/>

  <!-- birds -->
  <path d="M286 236 Q 296 224 306 236 Q 316 224 326 236" stroke="#332316" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M344 190 Q 352 181 360 190 Q 368 181 376 190" stroke="#332316" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M204 178 Q 214 166 224 178 Q 234 166 244 178" stroke="#332316" stroke-width="3.6" stroke-linecap="round" fill="none"/>
  <path d="M610 236 Q 620 224 630 236 Q 640 224 650 236" stroke="#332316" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- hills -->
  <path d="M0 640 C 150 548, 330 660, 540 604 C 660 572, 742 596, 800 550 L 800 800 L 0 800 Z" fill="#66744F"/>
  <path d="M0 706 C 190 636, 420 756, 610 704 C 700 680, 755 692, 800 672 L 800 800 L 0 800 Z" fill="#332316"/>

  <!-- tree (left) -->
  <rect x="146" y="520" width="20" height="104" rx="9" fill="#7A4A26"/>
  <circle cx="156" cy="500" r="66" fill="#66744F"/>
  <circle cx="122" cy="528" r="42" fill="#7F8F68"/>
  <circle cx="186" cy="468" r="30" fill="#7F8F68"/>

  <!-- tree (right) -->
  <rect x="628" y="560" width="16" height="84" rx="8" fill="#7A4A26"/>
  <circle cx="636" cy="536" r="52" fill="#66744F"/>
  <circle cx="666" cy="556" r="32" fill="#7F8F68"/>

  <!-- roof -->
  <path d="M258 430 L400 286 L542 430 Z" fill="#332316"/>
  <path d="M400 286 L400 314 L514 430 L542 430 Z" fill="#24180E" opacity="0.4"/>
