  <path d="M484 318 L514 318 L514 332 L484 332 Z" fill="#7F4E2B"/>
  <path d="M480 314 L518 314 L514 324 L484 324 Z" fill="#24180E"/>

  <!-- house body -->
  <rect x="282" y="430" width="236" height="188" rx="10" fill="url(#wallShade)"/>
  <rect x="282" y="430" width="236" height="188" rx="10" stroke="#E0CFAA" stroke-width="4"/>
  <!-- chhajja slab above -->
  <rect x="272" y="448" width="256" height="12" rx="6" fill="#A76B41"/>
  <rect x="272" y="454" width="256" height="3" fill="#7F4E2B" opacity="0.5"/>

