  <path d="M374 546 C 374 534, 426 534, 426 546 L426 566 L374 566 Z" fill="#945A34"/>
  <path d="M374 584 L426 584 L426 600 L374 600 Z" fill="#945A34"/>
  <circle cx="413" cy="574" r="3.6" fill="#CA9A4E"/>
